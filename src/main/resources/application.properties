spring.application.name=Web-Inventary
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost/web_inventory
spring.datasource.username=user_software
spring.datasource.password=0000
server.port=8086
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
logging.level.org.hibernate=ERROR
app.superadmin.email=${SUPERADMIN_EMAIL:}
app.superadmin.password=${SUPERADMIN_PASSWORD:}
spring.mail.host=${MAIL_HOST:}
