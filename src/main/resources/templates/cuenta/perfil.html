<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layout/layout :: head('Mi cuenta')}"></head>
<body>
<nav th:replace="~{Layout/layout :: navbar}"></nav>
<main style="max-width: 560px; margin: 2rem auto; padding: 1.5rem;">
    <h1>Mis datos</h1>
    <p th:if="${mensaje}" th:text="${mensaje}" role="status"></p>
    <p>Desde aquí puedes editar tus datos personales. El rol y el estado de la cuenta solo los administra el superadministrador.</p>
    <form th:action="@{/cuenta}" th:object="${cuenta}" method="post" style="display: grid; gap: 1rem;">
        <div>
            <label for="identificacion">Identificación</label>
            <input id="identificacion" type="text" th:field="*{identificacion}" required maxlength="45">
            <small th:if="${#fields.hasErrors('identificacion')}" th:errors="*{identificacion}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" required maxlength="45" autocomplete="name">
            <small th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="telefono">Teléfono</label>
            <input id="telefono" type="tel" th:field="*{telefono}" required maxlength="45" autocomplete="tel">
            <small th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="correo">Correo electrónico</label>
            <input id="correo" type="email" th:field="*{correo}" required maxlength="254" autocomplete="email">
            <small th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}" style="color: #b00020;"></small>
        </div>
        <button type="submit">Guardar cambios</button>
    </form>
</main>
<footer th:replace="~{Layout/layout :: footer}"></footer>
</body>
</html>
