<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layout/layout :: head('Crear cuenta')}"></head>
<body>
<nav th:replace="~{Layout/layout :: navbar}"></nav>

<main class="registro" style="max-width: 560px; margin: 2rem auto; padding: 1.5rem;">
    <h1>Crear cuenta</h1>

    <div th:if="${registroExitoso}" role="status" style="padding: 1rem; background: #e8f5e9; color: #1b5e20;">
        Tu cuenta fue creada. Se registró como usuario sin privilegios administrativos.
    </div>

    <form th:action="@{/registro}" th:object="${registro}" method="post" style="display: grid; gap: 1rem;">
        <div>
            <label for="identificacion">Identificación</label>
            <input id="identificacion" type="text" th:field="*{identificacion}" required maxlength="45" autocomplete="off">
            <small th:if="${#fields.hasErrors('identificacion')}" th:errors="*{identificacion}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" required maxlength="45" autocomplete="name">
            <small th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="telefono">Teléfono</label>
            <input id="telefono" type="tel" th:field="*{telefono}" required maxlength="45" autocomplete="tel">
            <small th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="correo">Correo electrónico</label>
            <input id="correo" type="email" th:field="*{correo}" required maxlength="254" autocomplete="email">
            <small th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input id="password" type="password" th:field="*{password}" required minlength="8" maxlength="128" autocomplete="new-password">
            <small>Debe tener al menos 8 caracteres.</small>
            <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: #b00020;"></small>
        </div>
        <button type="submit">Registrarme</button>
    </form>
</main>

<footer th:replace="~{Layout/layout :: footer}"></footer>
</body>
</html>
