<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Web Inventary</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="navbar" class="site-header">
    <nav class="nav-wrap" aria-label="Navegación principal">
        <a class="brand" th:href="@{/}" aria-label="Web Inventary, inicio">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="brand-name">Web<span>Inventary</span></span>
        </a>
        <div class="nav-menu">
            <input class="nav-toggle" type="checkbox" id="nav-toggle" aria-label="Mostrar navegación">
            <label class="nav-toggle-label" for="nav-toggle" aria-hidden="true"><span></span><span></span><span></span></label>
            <div class="nav-links">
                <a th:href="@{/}">Inicio</a>
                <a th:if="${isLoggedIn}" th:href="@{/clientes}">Clientes</a>
                <a th:if="${isLoggedIn}" th:href="@{/productos}">Productos</a>
                <a th:if="${isLoggedIn}" th:href="@{/proveedores}">Proveedores</a>
                <a th:if="${isLoggedIn}" th:href="@{/compras}">Compras</a>
                <a th:if="${isLoggedIn}" th:href="@{/ventas}">Ventas</a>
                <details th:if="${isLoggedIn}" class="nav-dropdown">
                    <summary>Dashboards</summary>
                    <div class="nav-dropdown-menu">
                        <a th:href="@{/dashboard/vendedor}">Vendedor</a>
                        <a th:href="@{/dashboard/comercial}">Comercial</a>
                        <a th:href="@{/dashboard/inventario}">Inventario</a>
                        <a th:if="${isSuperadmin or isAdmin}" th:href="@{/dashboard/financiero}">Financiero</a>
                    </div>
                </details>
                <a th:if="${isLoggedIn}" th:href="@{/busqueda}">Búsqueda</a>
                <a th:if="${isLoggedIn}" th:href="@{/reportes}">Reportes</a>
                <a th:if="${isSuperadmin}" th:href="@{/admin/usuarios}">Usuarios</a>
                <a th:if="${isSuperadmin}" th:href="@{/admin/aportes}">Aportes</a>
                <a th:if="${isSuperadmin}" th:href="@{/admin/anulaciones}">Anulaciones</a>
                <a th:if="${isSuperadmin}" th:href="@{/admin/auditoria}">Auditoría</a>
                <a th:if="${isLoggedIn}" th:href="@{/cuenta}">Mi cuenta</a>
                <a th:if="${isLoggedIn}" th:href="@{/aportes/mi-cuenta}">Mis aportes</a>
                <a th:if="${!isLoggedIn}" th:href="@{/registro}">Crear cuenta</a>
                <a th:if="${!isLoggedIn}" class="nav-login" th:href="@{/login}">Ingresar</a>
                <form th:if="${isLoggedIn}" th:action="@{/logout}" method="post">
                    <button class="nav-logout" type="submit">Salir</button>
                </form>
            </div>
        </div>
    </nav>
</header>
<footer th:fragment="footer" class="site-footer">
    <div class="footer-inner">
        <a class="brand brand-footer" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="brand-name">Web<span>Inventary</span></span>
        </a>
        <span>Gestión sencilla, inventario bajo control.</span>
        <small>&copy; Web Inventary</small>
    </div>
</footer>
</body>
</html>
