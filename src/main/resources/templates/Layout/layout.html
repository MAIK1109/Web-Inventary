<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Web Inventary</title>
</head>
<body>
<nav th:fragment="navbar" class="navbar sm:navbar-expand bg-1 fg-2">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Web Inventary</a>
        <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
            <div class="drawer-header">
                <h5 class="drawer-title" id="navbarNavLabel">Menú</h5>
                <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Cerrar"></button>
            </div>
            <div class="drawer-body">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/registro}">Crear cuenta</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/login}">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/cuenta}">Mi cuenta</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/usuarios}">Administrar usuarios</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Registrar cliente</a></li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post">
                            <button class="nav-link" type="submit">Cerrar sesión</button>
                        </form>
                    </li>
                </ul>
            </div>
        </dialog>
    </div>
</nav>
<footer th:fragment="footer">
    <p>&copy; Web Inventary</p>
</footer>
</body>
</html>
