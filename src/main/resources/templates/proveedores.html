<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layout/layout :: head('Proveedores')}"></head>
<body>
<nav th:replace="~{Layout/layout :: navbar}"></nav>
<main class="page-wrap">
    <header class="page-heading"><p class="eyebrow">Directorio comercial</p><h1>Proveedores</h1>
        <p>Registra y consulta la información de contacto de tus proveedores.</p></header>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}" role="status"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}" role="alert"></div>
    <section class="form-card">
        <h2>Registrar proveedor</h2>
        <form th:action="@{/proveedores}" th:object="${proveedor}" method="post">
            <div class="form-grid">
                <div class="field"><label for="identificacion">Identificación</label>
                    <input id="identificacion" type="text" th:field="*{identificacion}" maxlength="45" required autocomplete="off">
                    <small class="field-error" th:if="${#fields.hasErrors('identificacion')}" th:errors="*{identificacion}"></small></div>
                <div class="field"><label for="razonSocial">Razón social</label>
                    <input id="razonSocial" type="text" th:field="*{razonSocial}" maxlength="45" required autocomplete="organization">
                    <small class="field-error" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></small></div>
                <div class="field"><label for="telefono">Teléfono</label>
                    <input id="telefono" type="tel" th:field="*{telefono}" maxlength="45" required autocomplete="tel">
                    <small class="field-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></small></div>
                <div class="field"><label for="correo">Correo electrónico</label>
                    <input id="correo" type="email" th:field="*{correo}" maxlength="254" required autocomplete="email">
                    <small class="field-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></small></div>
                <div class="field field-full"><label for="direccion">Dirección</label>
                    <input id="direccion" type="text" th:field="*{direccion}" maxlength="45" required autocomplete="street-address">
                    <small class="field-error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></small></div>
            </div>
            <div class="form-actions"><button class="button button-primary" type="submit">Guardar proveedor</button></div>
        </form>
    </section>
    <section class="table-card" style="margin-top: 20px">
        <div class="table-top"><div><h2>Proveedores registrados</h2><p th:text="|${#lists.size(proveedores)} proveedores|"></p></div></div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>Identificación</th><th>Razón social</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th>Acción</th></tr></thead>
            <tbody><tr th:each="item : ${proveedores}"><td th:text="${item.identificacion}"></td><td th:text="${item.nombre}"></td><td th:text="${item.telefono}"></td><td th:text="${item.correo}"></td><td th:text="${item.direccion}"></td>
                <td><form th:if="${isSuperadmin}" th:action="@{/admin/eliminaciones/PROVEEDOR/{id}(id=${item.idProveedor})}" method="post" onsubmit="return confirm('¿Eliminar este proveedor si no tiene compras?')"><button class="button button-danger button-small" type="submit">Eliminar</button></form></td></tr>
                <tr th:if="${#lists.isEmpty(proveedores)}"><td class="empty-state" colspan="6">Aún no hay proveedores registrados.</td></tr></tbody>
        </table></div>
    </section>
</main>
<footer th:replace="~{Layout/layout :: footer}"></footer>
</body>
</html>
