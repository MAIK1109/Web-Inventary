<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layout/layout :: head('Editar cuenta')}"></head>
<body>
<nav th:replace="~{Layout/layout :: navbar}"></nav>
<main style="max-width: 560px; margin: 2rem auto; padding: 1.5rem;">
    <h1>Administrar cuenta</h1>
    <p>Estado actual: <strong th:text="${usuario.estadoCuenta == null ? 'ACTIVA (cuenta anterior)' : usuario.estadoCuenta}"></strong></p>
    <p th:if="${usuario.rol == 'SUPERADMIN'}">La cuenta del superadministrador no se puede bloquear ni cambiar de rol.</p>
    <form th:action="@{/admin/usuarios/{id}(id=${usuarioId})}" th:object="${cuenta}" method="post" style="display: grid; gap: 1rem;">
        <div>
            <label for="identificacion">Identificación</label>
            <input id="identificacion" type="text" th:field="*{identificacion}" required maxlength="45">
            <small th:if="${#fields.hasErrors('identificacion')}" th:errors="*{identificacion}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" required maxlength="45">
            <small th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="telefono">Teléfono</label>
            <input id="telefono" type="tel" th:field="*{telefono}" required maxlength="45">
            <small th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="correo">Correo</label>
            <input id="correo" type="email" th:field="*{correo}" required maxlength="254">
            <small th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}" style="color: #b00020;"></small>
        </div>
        <div>
            <label for="rol">Rol</label>
            <select id="rol" th:field="*{rol}">
                <option value="USUARIO">Usuario</option>
                <option value="ADMINISTRADOR">Administrador</option>
                <option th:if="${usuario.rol == 'SUPERADMIN'}" value="SUPERADMIN">Superadministrador</option>
            </select>
            <small th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}" style="color: #b00020;"></small>
        </div>
        <button type="submit">Guardar cambios</button>
    </form>
    <p><a th:href="@{/admin/usuarios}">Volver a usuarios</a></p>
</main>
<footer th:replace="~{Layout/layout :: footer}"></footer>
</body>
</html>
