<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layout/layout :: head('Aprobación de aportes')}"></head>
<body>
<nav th:replace="~{Layout/layout :: navbar}"></nav>
<main class="page-wrap">
    <header class="page-heading">
        <p class="eyebrow">Panel de control</p>
        <h1>Aprobación de aportes</h1>
        <p>Revisa los aportes enviados y aprueba únicamente los que hayan sido confirmados.</p>
    </header>
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}" role="status"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}" role="alert"></div>
    <section class="table-card">
        <div class="table-top"><div><h2>Capital aportado</h2><p>Total de aportes aprobados</p></div>
            <strong th:text="${totalGeneral}">0</strong></div>
        <div class="table-wrap"><table class="data-table">
            <thead><tr><th>Número</th><th>Usuario</th><th>Fecha</th><th>Monto</th><th>Medio de pago</th><th>Soporte</th><th>Estado</th><th>Capital del usuario</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="aporte : ${aportes}">
                <td th:text="${aporte.idInversion}"></td>
                <td><strong th:text="${aporte.usuario.nombre}"></strong><small class="table-subtext" th:text="${aporte.usuario.correo}"></small></td>
                <td th:text="${aporte.fecha}"></td><td th:text="${aporte.monto}"></td>
                <td th:text="${aporte.medioPago}"></td>
                <td><a th:if="${aporte.soporteArchivo != null}" th:href="@{/admin/aportes/{id}/soporte(id=${aporte.idInversion})}">Descargar</a><span th:if="${aporte.soporteArchivo == null}">—</span></td>
                <td><span class="status-pill" th:text="${aporte.estado == 0 ? 'PENDIENTE' : (aporte.estado == 1 ? 'APROBADO' : (aporte.estado == 3 ? 'ANULADO' : 'RECHAZADO'))}"></span>
                    <small class="table-subtext" th:if="${aporte.aprobadoPor != null}" th:text="|Por ${aporte.aprobadoPor}|"></small></td>
                <td th:text="${totalesPorUsuario[aporte.usuario.idUsuario] == null ? 0 : totalesPorUsuario[aporte.usuario.idUsuario]}"></td>
                <td><div class="table-actions" th:if="${aporte.estado == estadoPendiente}">
                    <form th:action="@{/admin/aportes/{id}/aprobar(id=${aporte.idInversion})}" method="post"><button class="button button-primary button-small" type="submit">Aprobar</button></form>
                    <form th:action="@{/admin/aportes/{id}/rechazar(id=${aporte.idInversion})}" method="post"><button class="button button-danger button-small" type="submit">Rechazar</button></form>
                </div></td>
            </tr>
            <tr th:if="${#lists.isEmpty(aportes)}"><td class="empty-state" colspan="9">Todavía no hay aportes registrados.</td></tr>
            </tbody>
        </table></div>
    </section>
</main>
<footer th:replace="~{Layout/layout :: footer}"></footer>
</body>
</html>
