<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Layout/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{Layout/layout :: navbar}"></nav>
<main style="max-width: 440px; margin: 2rem auto; padding: 1.5rem;">
    <h1>Iniciar sesión</h1>
    <p th:if="${param.error}" role="alert" style="color: #b00020;">Correo o contraseña incorrectos, o la cuenta está pendiente de activación o bloqueada.</p>
    <p th:if="${param.logout}">La sesión se cerró correctamente.</p>
    <p th:if="${param.correoActualizado}">Actualizaste tu correo. Inicia sesión con el nuevo correo.</p>
    <form th:action="@{/login}" method="post" style="display: grid; gap: 1rem;">
        <div>
            <label for="username">Correo</label>
            <input id="username" name="username" type="email" required autocomplete="username">
        </div>
        <div>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit">Ingresar</button>
    </form>
</main>
<footer th:replace="~{Layout/layout :: footer}"></footer>
</body>
</html>
